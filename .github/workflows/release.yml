name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  appimage:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libsecret-1-dev patchelf file xvfb dbus-x11 gnome-keyring webkit2gtk-driver qpdf
      - run: pnpm install --frozen-lockfile
      - run: pnpm appimage
      - run: cargo install tauri-driver --locked
      - run: pnpm appimage:smoke
      - name: Software bill of materials
        run: |
          pnpm run licenses
          pnpm dlx @cyclonedx/cdxgen@11 -o sbom.cdx.json --no-install-deps .
      - name: Checksums
        run: |
          cp apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage .
          sha256sum *.AppImage > SHA256SUMS
      - name: Draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            *.AppImage
            SHA256SUMS
            sbom.cdx.json
            THIRD-PARTY-NOTICES.md
