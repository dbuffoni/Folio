name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  appimage:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libsecret-1-dev patchelf file xvfb dbus-x11 gnome-keyring webkit2gtk-driver qpdf
      - run: pnpm install --frozen-lockfile
      - run: pnpm appimage
      - run: cargo install tauri-driver --locked
      - run: pnpm appimage:smoke
      - uses: actions/upload-artifact@v4
        with:
          name: release-appimage
          path: apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage

  # Unsigned installers: Windows shows SmartScreen, macOS needs right-click > Open (docs/BUILDING.md).
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @folio/desktop bundle:windows
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe

  macos:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @folio/desktop bundle:macos
      - uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg

  release:
    needs: [appimage, windows, macos]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist-release
          merge-multiple: true
      - name: Software bill of materials
        run: |
          pnpm install --frozen-lockfile
          pnpm run licenses
          pnpm dlx @cyclonedx/cdxgen@11 -o sbom.cdx.json --no-install-deps .
      - name: Checksums
        run: cd dist-release && sha256sum * > SHA256SUMS
      - name: Draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            dist-release/*
            sbom.cdx.json
            THIRD-PARTY-NOTICES.md
