name: Release

# The pipeline never publishes. A tag creates a DRAFT release (draft: true, asserted again after the
# upload); a person reviews it and clicks "Publish". Procedure: docs/BUILDING.md, section Release.
#   v1.2.3      full pipeline, draft release
#   v1.2.3-rc1  the same, plus the distribution smoke matrix (Fedora, Arch, Ubuntu 20.04), draft pre-release
#   dispatch    dry run on any branch: builds, smoke tests (incl. the distribution matrix), SBOM,
#               checksums and signing, uploads the bundle as a workflow artifact, creates no release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash -euo pipefail {0}

env:
  CDXGEN_VERSION: 11.11.0

jobs:
  appimage:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libsecret-1-dev patchelf file xvfb dbus-x11 gnome-keyring webkit2gtk-driver qpdf
      - run: pnpm install --frozen-lockfile
      - name: Version from the tag
        # The tag is the single source of truth: installer names, the app's About page and the Cargo
        # package all take it (tools/set-version.ts). A dispatch dry run keeps the committed version.
        if: startsWith(github.ref, 'refs/tags/')
        run: pnpm exec tsx tools/set-version.ts "$GITHUB_REF_NAME"
      - run: pnpm appimage
      - run: cargo install tauri-driver --locked
      - run: pnpm appimage:smoke
      # The distribution matrix runs the same scenario in containers: it needs the driver binary and a fixture.
      - name: Smoke support files
        run: |
          mkdir -p smoke-support
          cp "$(command -v tauri-driver)" smoke-support/tauri-driver
          pnpm exec tsx -e "import('@folio/testkit').then(async (t) => (await import('node:fs')).writeFileSync('smoke-support/Smoke test.pdf', await t.fixture('invoice')))"
      - uses: actions/upload-artifact@v7
        with:
          name: release-appimage
          path: apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: smoke-support
          path: smoke-support/*
          if-no-files-found: error

  # Release candidates only (tag v*-rc*) and on demand: the AppImage must also start on other
  # distributions. Ubuntu 20.04 (glibc 2.31) is informational: the AppImage is built on 22.04
  # (glibc 2.35), so a failure there documents the real minimum glibc instead of blocking the draft.
  distro-smoke:
    needs: appimage
    if: github.event_name == 'workflow_dispatch' || (startsWith(github.ref, 'refs/tags/') && contains(github.ref_name, '-rc'))
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    continue-on-error: ${{ matrix.informational }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: 'fedora:42', informational: false }
          - { image: 'archlinux:latest', informational: false }
          - { image: 'ubuntu:20.04', informational: true }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/download-artifact@v8
        with:
          pattern: '{release-appimage,smoke-support}'
          path: dl
          merge-multiple: true
      - name: Smoke test in ${{ matrix.image }}
        run: |
          chmod +x dl/tauri-driver dl/*.AppImage
          TAURI_DRIVER="$PWD/dl/tauri-driver" bash apps/desktop/scripts/smoke-distro.sh "${{ matrix.image }}" dl/*.AppImage "dl/Smoke test.pdf"

  # Unsigned installers: Windows shows SmartScreen, macOS needs right-click > Open (docs/BUILDING.md).
  windows:
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      - name: Version from the tag
        # The tag is the single source of truth: installer names, the app's About page and the Cargo
        # package all take it (tools/set-version.ts). A dispatch dry run keeps the committed version.
        if: startsWith(github.ref, 'refs/tags/')
        run: pnpm exec tsx tools/set-version.ts "$GITHUB_REF_NAME"
      - run: pnpm --filter @folio/desktop bundle:windows
      - uses: actions/upload-artifact@v7
        with:
          name: release-windows
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  macos:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - run: pnpm install --frozen-lockfile
      - name: Version from the tag
        # The tag is the single source of truth: installer names, the app's About page and the Cargo
        # package all take it (tools/set-version.ts). A dispatch dry run keeps the committed version.
        if: startsWith(github.ref, 'refs/tags/')
        run: pnpm exec tsx tools/set-version.ts "$GITHUB_REF_NAME"
      - run: pnpm --filter @folio/desktop bundle:macos
      - uses: actions/upload-artifact@v7
        with:
          name: release-macos
          path: apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error

  # SBOM, checksums, optional signature, DRAFT release. Runs the same steps on dispatch (dry run) but
  # only the last step touches GitHub releases, and only for tags.
  release:
    needs: [appimage, distro-smoke, windows, macos]
    # distro-smoke is skipped on plain tags; a skipped job must not skip the release.
    if: ${{ !cancelled() && needs.appimage.result == 'success' && needs.windows.result == 'success' && needs.macos.result == 'success' && (needs.distro-smoke.result == 'success' || needs.distro-smoke.result == 'skipped') }}
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist-release
          merge-multiple: true
      - run: pnpm install --frozen-lockfile
      - name: Software bill of materials (CycloneDX)
        run: |
          pnpm run licenses
          pnpm dlx "@cyclonedx/cdxgen@${CDXGEN_VERSION}" -o sbom.cdx.json --no-install-deps .
      - name: Validate the SBOM
        # JSON parses, bomFormat CycloneDX, specVersion, non-empty components, and every production
        # package of the web app in pnpm-lock.yaml is listed (tools/validate-sbom.mjs).
        run: node tools/validate-sbom.mjs sbom.cdx.json pnpm-lock.yaml apps/web
      - name: Assemble release files and checksums
        run: |
          mkdir release-files
          cp dist-release/* sbom.cdx.json THIRD-PARTY-NOTICES.md release-files/
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            version="${GITHUB_REF_NAME#v}"
            for f in release-files/*.AppImage release-files/*.exe release-files/*.dmg; do
              [[ "$f" == *"_${version}_"* ]] || { echo "::error::$f does not carry the tag version ${version}"; exit 1; }
            done
          fi
          cd release-files
          find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\n' | sort | xargs -d '\n' sha256sum > SHA256SUMS
          cat SHA256SUMS
      - name: Sign AppImage and checksums (GPG, detached)
        id: sign
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          if [ -z "${GPG_PRIVATE_KEY:-}" ]; then
            echo "::notice title=Release is NOT signed::Secret GPG_PRIVATE_KEY is not set, so no .asc signatures were made. Add GPG_PRIVATE_KEY (and GPG_PASSPHRASE) to sign; see docs/BUILDING.md."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          export GNUPGHOME
          GNUPGHOME="$(mktemp -d)"
          chmod 700 "$GNUPGHOME"
          printf '%s\n' "$GPG_PRIVATE_KEY" | gpg --batch --quiet --import
          fpr="$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr:/ { print $10; exit }')"
          [ -n "$fpr" ] || { echo "::error::GPG_PRIVATE_KEY did not contain a secret key"; exit 1; }
          cd release-files
          for f in *.AppImage SHA256SUMS; do
            gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 --local-user "$fpr" \
              --armor --detach-sign --output "$f.asc" "$f" <<<"${GPG_PASSPHRASE:-}"
          done
          gpg --armor --export "$fpr" > folio-release-key.asc
          echo "::notice title=Release signed::Signed with key $fpr"
          echo "signed=true" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: release-bundle
          path: release-files/*
          if-no-files-found: error
      - name: Draft release
        id: draft
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: release-files/*
      - name: Assert the release is still a draft
        # Resolved by tag name from the list of releases (drafts included), not by the action's id
        # output; the JSON that was read is printed so a failure can be diagnosed from the log.
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          ACTION_RELEASE_ID: ${{ steps.draft.outputs.id }}
        run: |
          echo "action reported release id: ${ACTION_RELEASE_ID:-none}"
          releases="$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --paginate)"
          found="$(jq -c -s --arg tag "$GITHUB_REF_NAME" '[.[][] | select(.tag_name == $tag)] | map({id, tag_name, name, draft, prerelease, published_at, assets: (.assets | length)})' <<<"$releases")"
          echo "releases tagged $GITHUB_REF_NAME: $found"
          [ "$(jq 'length' <<<"$found")" -ge 1 ] || { echo "::error::no release found for tag $GITHUB_REF_NAME"; exit 1; }
          published="$(jq -r '[.[] | select(.draft == false)] | length' <<<"$found")"
          [ "$published" = 0 ] || { echo "::error::release $GITHUB_REF_NAME is published (draft=false): $found"; exit 1; }
          echo "::notice title=Draft release ready::Review it under Releases and publish by hand."

  # Last job: the bundle that went to the draft is checked as a user would check a download.
  verify:
    needs: release
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-bundle
          path: bundle
      - name: Checksums
        working-directory: bundle
        run: |
          sha256sum -c SHA256SUMS
      - name: Signatures
        working-directory: bundle
        run: |
          if [ ! -f SHA256SUMS.asc ]; then
            echo "::notice title=Signatures not verified::The release is not signed (no GPG_PRIVATE_KEY secret)."
            exit 0
          fi
          export GNUPGHOME
          GNUPGHOME="$(mktemp -d)"
          chmod 700 "$GNUPGHOME"
          gpg --batch --quiet --import folio-release-key.asc
          for sig in *.asc; do
            [ "$sig" = folio-release-key.asc ] && continue
            gpg --batch --verify "$sig" "${sig%.asc}"
          done
