name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: bash -euo pipefail {0}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # apt held jobs for 25-30 minutes in needrestart's prompt: never ask questions, in any job.
  DEBIAN_FRONTEND: noninteractive
  NEEDRESTART_MODE: a
  # 0.11.x rejects the choice fields of our generated forms ("corrupt choice field") and lists none;
  # the form oracle needs the version the tests are developed against.
  PDFCPU_VERSION: 0.16.2

jobs:
  # Decides how much to run. Every pull request gets the fast tier: static checks, the unit, conformance and
  # interop suites, and the web e2e in Chromium. The heavy tier (Firefox and WebKit, Windows and macOS, performance
  # budgets) runs on main, on release pull requests (head branch release/*) and on demand. The Rust jobs (Linux
  # clippy and tests, the AppImage) run when the desktop shell, a workflow or a lock file changed, and always in
  # the heavy tier. Skipped jobs count as passed for required checks.
  plan:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      full: ${{ steps.p.outputs.full }}
      rust: ${{ steps.p.outputs.rust }}
      browsers: ${{ steps.p.outputs.browsers }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: p
        env:
          EVENT: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          full=false
          if [ "$EVENT" != pull_request ] || [[ "$HEAD_REF" == release/* ]]; then full=true; fi
          rust=$full
          if [ "$EVENT" = pull_request ] && git diff --name-only "origin/${BASE_REF}...HEAD" | grep -qE '^(apps/desktop/|\.github/workflows/|pnpm-lock\.yaml$|rust-toolchain\.toml$)'; then rust=true; fi
          echo "full=$full" >> "$GITHUB_OUTPUT"
          echo "rust=$rust" >> "$GITHUB_OUTPUT"
          if [ "$full" = true ]; then echo 'browsers=["chromium","firefox","webkit"]' >> "$GITHUB_OUTPUT"; else echo 'browsers=["chromium"]' >> "$GITHUB_OUTPUT"; fi
          echo "heavy tier: $full, rust jobs: $rust"

  # Everything that needs no browser and no Tauri (SPEC §15 headless-first rule).
  headless:
    needs: plan
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: PDF oracles
        run: |
          sudo apt-get update
          sudo apt-get install -y qpdf poppler-utils mupdf-tools
          curl -sSL "https://github.com/pdfcpu/pdfcpu/releases/download/v${PDFCPU_VERSION}/pdfcpu_${PDFCPU_VERSION}_Linux_x86_64.tar.xz" | sudo tar -xJ --strip-components=1 -C /usr/local/bin --wildcards '*/pdfcpu'
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm check
      - run: pnpm coverage
      - run: pnpm test:interop
      # Timing budgets on a shared runner are noisy: heavy tier only.
      - if: needs.plan.outputs.full == 'true'
        run: pnpm bench
      - run: pnpm trace
      # `pnpm licenses` alone is pnpm's own command; the repo's checker is the script of that name.
      - run: pnpm exec tsx tools/licenses.ts --check
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-and-diffs
          path: |
            coverage
            tests/golden/baselines/__diff__
          if-no-files-found: ignore

  # Web build driven in the browsers: epics, screens, accessibility, no-network. Chromium on every pull request;
  # Firefox and WebKit in the heavy tier, one job each so they run side by side.
  e2e:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        # Chromium alone on ordinary pull requests, the three of them in the heavy tier.
        browser: ${{ fromJSON(needs.plan.outputs.browsers) }}
    name: e2e (${{ matrix.browser }})
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: PDF oracles
        timeout-minutes: 5
        run: sudo apt-get update && sudo apt-get install -y qpdf poppler-utils mupdf-tools
      - name: Playwright version
        id: pw
        run: echo "v=$(pnpm --filter @folio/web exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ steps.pw.outputs.v }}-${{ matrix.browser }}
      - name: Browser and its system libraries
        timeout-minutes: 8
        run: |
          if [ "${{ steps.browsers.outputs.cache-hit }}" = true ]; then
            pnpm --filter @folio/web exec playwright install-deps ${{ matrix.browser }}
          else
            pnpm --filter @folio/web exec playwright install --with-deps ${{ matrix.browser }}
          fi
      # Visual baselines are rendered with the fonts of the reference machine; they are compared
      # in the release checklist, not on shared runners.
      - run: pnpm test:e2e --project=${{ matrix.browser }} --grep-invert "screens in the"
      - run: pnpm exec tsx tools/bundle-size.ts
        if: matrix.browser == 'chromium'
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-results-${{ matrix.browser }}
          path: apps/web/test-results

  # Rust lints and tests of the desktop shell on Linux, beside the AppImage build so the two compile in parallel.
  rust-check:
    needs: plan
    if: needs.plan.outputs.rust == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: System libraries
        timeout-minutes: 8
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libsecret-1-dev patchelf file
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @folio/desktop check

  # Release build of the desktop app and its smoke test under Xvfb.
  appimage:
    needs: plan
    if: needs.plan.outputs.rust == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - name: System libraries
        timeout-minutes: 8
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libsecret-1-dev patchelf file xvfb dbus-x11 gnome-keyring webkit2gtk-driver qpdf
      - run: pnpm install --frozen-lockfile
      - run: pnpm appimage
      - run: cargo install tauri-driver --locked
      - run: pnpm appimage:smoke
      - name: Checksums
        run: cd apps/desktop/src-tauri/target/release/bundle/appimage && sha256sum *.AppImage > SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: folio-appimage
          path: |
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            apps/desktop/src-tauri/target/release/bundle/appimage/SHA256SUMS

  # Windows and macOS: the desktop shell must keep compiling, passing its Rust tests and bundling
  # (SPEC NFR-09, §14). Installers are unsigned; there is no smoke test off Linux yet.
  desktop-cross-platform:
    needs: plan
    if: needs.plan.outputs.full == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            bundle: bundle:windows
            artifact: folio-windows
            path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          - os: macos-15
            bundle: bundle:macos
            artifact: folio-macos
            path: apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - run: pnpm install --frozen-lockfile
      # Clippy runs once, on Linux (rust-check); here the platform-specific code is compiled by the bundle and its
      # unit tests run.
      - run: cd apps/desktop/src-tauri && cargo test
      - run: pnpm --filter @folio/desktop ${{ matrix.bundle }}
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}

  # Unit, conformance and interop suites on Windows and macOS: they must not depend on the host OS.
  tests-cross-platform:
    needs: plan
    if: needs.plan.outputs.full == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The certificate tests build PKCS#12 files with OpenSSL 3 (-legacy, AES protection); macOS ships LibreSSL.
      - name: OpenSSL 3
        if: runner.os == 'macOS'
        run: |
          brew install openssl@3
          echo "$(brew --prefix openssl@3)/bin" >> "$GITHUB_PATH"
      # The unit suites validate their output with qpdf, so the oracles come first.
      - name: PDF oracles
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            brew install qpdf poppler mupdf-tools
          else
            # The community feed fails now and then and choco still exits 0 for the other packages:
            # install one at a time, retry, and check that the tool really arrived.
            for pkg in qpdf poppler mupdf; do
              for attempt in 1 2 3; do
                choco install -y "$pkg" && [ -d "/c/ProgramData/chocolatey/lib/$pkg" ] && break
                echo "::warning::choco install $pkg failed (attempt $attempt)"; sleep 15
              done
              [ -d "/c/ProgramData/chocolatey/lib/$pkg" ] || { echo "::error::$pkg could not be installed"; exit 1; }
            done
            export PATH="$PATH:/c/ProgramData/chocolatey/bin"
            echo 'C:\ProgramData\chocolatey\bin' >> "$GITHUB_PATH"
          fi
          qpdf --version
      - name: pdfcpu
        run: |
          if [ "$RUNNER_OS" = macOS ]; then asset="Darwin_arm64.tar.xz"; else asset="Windows_x86_64.zip"; fi
          dir="$RUNNER_TEMP/pdfcpu"
          mkdir -p "$dir"
          curl -sSL -o "$dir/archive" "https://github.com/pdfcpu/pdfcpu/releases/download/v${PDFCPU_VERSION}/pdfcpu_${PDFCPU_VERSION}_${asset}"
          if [ "$RUNNER_OS" = macOS ]; then tar -xJf "$dir/archive" -C "$dir"; else 7z x -y "-o$dir" "$dir/archive" >/dev/null; fi
          bin="$(dirname "$(find "$dir" -type f \( -name pdfcpu -o -name pdfcpu.exe \) | head -1)")"
          chmod +x "$bin"/pdfcpu* 2>/dev/null || true
          if [ "$RUNNER_OS" = Windows ]; then bin="$(cygpath -w "$bin")"; fi
          echo "$bin" >> "$GITHUB_PATH"
      - run: pdfcpu version
      - run: pnpm test
      - run: pnpm test:conformance
      - run: pnpm test:interop
