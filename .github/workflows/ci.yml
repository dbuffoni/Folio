name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: bash -euo pipefail {0}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # 0.11.x rejects the choice fields of our generated forms ("corrupt choice field") and lists none;
  # the form oracle needs the version the tests are developed against.
  PDFCPU_VERSION: 0.16.2

jobs:
  # Everything that needs no browser and no Tauri (SPEC §15 headless-first rule).
  headless:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: PDF oracles
        run: |
          sudo apt-get update
          sudo apt-get install -y qpdf poppler-utils mupdf-tools
          curl -sSL "https://github.com/pdfcpu/pdfcpu/releases/download/v${PDFCPU_VERSION}/pdfcpu_${PDFCPU_VERSION}_Linux_x86_64.tar.xz" | sudo tar -xJ --strip-components=1 -C /usr/local/bin --wildcards '*/pdfcpu'
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm check
      - run: pnpm coverage
      - run: pnpm test:interop
      - run: pnpm bench
      - run: pnpm trace
      # `pnpm licenses` alone is pnpm's own command; the repo's checker is the script of that name.
      - run: pnpm exec tsx tools/licenses.ts --check
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-and-diffs
          path: |
            coverage
            tests/golden/baselines/__diff__
          if-no-files-found: ignore

  # Web build driven in three browsers: epics, screens, accessibility, no-network.
  e2e:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: sudo apt-get update && sudo apt-get install -y qpdf poppler-utils mupdf-tools
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @folio/web exec playwright install --with-deps chromium firefox webkit
      # Visual baselines are rendered with the fonts of the reference machine; they are compared
      # in the release checklist, not on shared runners.
      - run: pnpm test:e2e --grep-invert "screens in the"
      - run: pnpm exec tsx tools/bundle-size.ts
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-results
          path: apps/web/test-results

  # Release build of the desktop app and its smoke test under Xvfb.
  appimage:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libsecret-1-dev patchelf file xvfb dbus-x11 gnome-keyring webkit2gtk-driver qpdf
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @folio/desktop check
      - run: pnpm appimage
      - run: cargo install tauri-driver --locked
      - run: pnpm appimage:smoke
      - name: Checksums
        run: cd apps/desktop/src-tauri/target/release/bundle/appimage && sha256sum *.AppImage > SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: folio-appimage
          path: |
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            apps/desktop/src-tauri/target/release/bundle/appimage/SHA256SUMS

  # Windows and macOS: the desktop shell must keep compiling, passing its Rust tests and bundling
  # (SPEC NFR-09, §14). Installers are unsigned; there is no smoke test off Linux yet.
  desktop-cross-platform:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            bundle: bundle:windows
            artifact: folio-windows
            path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          - os: macos-15
            bundle: bundle:macos
            artifact: folio-macos
            path: apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @folio/desktop check
      - run: pnpm --filter @folio/desktop ${{ matrix.bundle }}
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}

  # Unit, conformance and interop suites on Windows and macOS: they must not depend on the host OS.
  tests-cross-platform:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The certificate tests build PKCS#12 files with OpenSSL 3 (-legacy, AES protection); macOS ships LibreSSL.
      - name: OpenSSL 3
        if: runner.os == 'macOS'
        run: |
          brew install openssl@3
          echo "$(brew --prefix openssl@3)/bin" >> "$GITHUB_PATH"
      # The unit suites validate their output with qpdf, so the oracles come first.
      - name: PDF oracles
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            brew install qpdf poppler mupdf-tools
          else
            # The community feed fails now and then and choco still exits 0 for the other packages:
            # install one at a time, retry, and check that the tool really arrived.
            for pkg in qpdf poppler mupdf; do
              for attempt in 1 2 3; do
                choco install -y "$pkg" && [ -d "/c/ProgramData/chocolatey/lib/$pkg" ] && break
                echo "::warning::choco install $pkg failed (attempt $attempt)"; sleep 15
              done
              [ -d "/c/ProgramData/chocolatey/lib/$pkg" ] || { echo "::error::$pkg could not be installed"; exit 1; }
            done
            export PATH="$PATH:/c/ProgramData/chocolatey/bin"
            echo 'C:\ProgramData\chocolatey\bin' >> "$GITHUB_PATH"
          fi
          qpdf --version
      - name: pdfcpu
        run: |
          if [ "$RUNNER_OS" = macOS ]; then asset="Darwin_arm64.tar.xz"; else asset="Windows_x86_64.zip"; fi
          dir="$RUNNER_TEMP/pdfcpu"
          mkdir -p "$dir"
          curl -sSL -o "$dir/archive" "https://github.com/pdfcpu/pdfcpu/releases/download/v${PDFCPU_VERSION}/pdfcpu_${PDFCPU_VERSION}_${asset}"
          if [ "$RUNNER_OS" = macOS ]; then tar -xJf "$dir/archive" -C "$dir"; else 7z x -y "-o$dir" "$dir/archive" >/dev/null; fi
          bin="$(dirname "$(find "$dir" -type f \( -name pdfcpu -o -name pdfcpu.exe \) | head -1)")"
          chmod +x "$bin"/pdfcpu* 2>/dev/null || true
          if [ "$RUNNER_OS" = Windows ]; then bin="$(cygpath -w "$bin")"; fi
          echo "$bin" >> "$GITHUB_PATH"
      - run: pdfcpu version
      - run: pnpm test
      - run: pnpm test:conformance
      - run: pnpm test:interop
